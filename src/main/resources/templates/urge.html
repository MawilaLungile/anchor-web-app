<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${me.theme()}">
<head th:replace="~{fragments/layout :: head('Pause')}"></head>
<body>
<main id="urge" class="calm">
    <div class="wrap">
        <a class="icon-btn" th:href="${source == 'session'} ? @{/focus} : @{/}" aria-label="Close"><span class="i">close</span></a>

        <!-- Breathing -->
        <section id="breathe" class="stack" style="gap: 26px; text-align: center;">
            <div class="stack-sm">
                <h1 class="display" style="font-size: 30px; color: #fff;" th:text="${headline}">This feeling will pass.</h1>
                <p class="soft" th:text="${subline}">Ride this one out.</p>
            </div>

            <div class="breath">
                <div id="orb" class="orb"></div>
                <div class="label">
                    <div id="breath-text" class="strong" style="font-size: 19px; color: #fff;">Breathe in</div>
                    <div id="secs" class="display" style="font-size: 42px; color: #BDF2D2;">60</div>
                </div>
            </div>

            <div class="meter"><div id="urge-meter"></div></div>
            <button id="skip" class="link" type="button" style="color: #BFDCCB;">I already feel calmer</button>
            <noscript><p class="soft">Breathe slowly: in for 4, hold for 4, out for 6. Repeat for a minute, then continue below.</p></noscript>
        </section>

        <!-- Reflection -->
        <section id="reflect" class="stack hidden" style="gap: 22px;">
            <div class="stack-sm">
                <h1 class="display" style="font-size: 28px; color: #fff;">You made it through the wave.</h1>
                <p class="soft">What was behind it? Naming the trigger takes away some of its power.</p>
            </div>
            <form class="stack" th:action="@{/urge}" method="post">
                <input type="hidden" name="source" th:value="${source}">
                <div class="chips">
                    <label class="chip dark" th:each="t, it : ${triggers}">
                        <input type="radio" name="trigger" th:value="${t.name()}" th:checked="${it.first}">
                        <span><span class="i" th:text="${t.icon()}">waves</span><span th:text="${t.name()}">Bored</span></span>
                    </label>
                </div>
                <button class="btn block sage" type="submit" name="resisted" value="true">I rode it out</button>
                <button class="btn block glass" type="submit" name="resisted" value="false">I gave in</button>
            </form>
        </section>
    </div>
</main>
<noscript><style>#reflect { display: flex !important; }</style></noscript>
</body>
</html>
